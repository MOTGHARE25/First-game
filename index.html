<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ultimate Anime Game — Flappy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Ultimate Anime Game</h1>
    <h2>Flappy — 5 Levels</h2>
    <canvas id="game" width="480" height="640"></canvas>
    <div class="hud">
      <div id="score">Score: 0</div>
      <div id="level">Level: 1</div>
    </div>
    <div class="controls">Click or press Space to flap — Good luck!</div>
    <div class="branding">Presented by Mr. Dhananjay Motghare</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
